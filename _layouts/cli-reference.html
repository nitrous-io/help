---
layout: default
---

<div id="post">
  {% if post.draft %}
    <div class="notice">You've stumbled upon a draft.</div>
  {% else %}
    <article>
      <header>
        <hgroup>
          <h1 style="margin-bottom:1.5rem"> {{ page.title }}</h1>
        </hgroup>
      </header>
      {{ content }}
    </article>
  {% endif %}
</div>
