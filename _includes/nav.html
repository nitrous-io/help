<header role="banner" id="hoverlay">
  <hgroup role="navigation">
    <a href="/" id="home"><span class="title">PubStorm</span>Help</a>

    {% for category in site.categories %}
      <ul class="links">
        {% assign posts = category | last | sort: "navorder" %}
        <li class="vh600"><h3>{{ category | first }}</h3></li>
        {% for post in posts %}
          {% unless post.draft %}
            <li class="vh600"><a href="{{ post.url }}" id="docs">{{ post.title }}</a></li>
          {% endunless %}
        {% endfor %}
      </ul>
    {% endfor %}
  </hgroup>
</header>
